<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Hexagon Background -->
  <polygon points="50,5 95,27.5 95,72.5 50,95 5,72.5 5,27.5" fill="none" stroke="#5E6AD2" stroke-width="4"/>
  
  <!-- Connected Nodes -->
  <!-- Top node -->
  <circle cx="50" cy="25" r="8" fill="#5E6AD2"/>
  
  <!-- Bottom left node -->
  <circle cx="30" cy="65" r="8" fill="#5E6AD2"/>
  
  <!-- Bottom right node (gold accent) -->
  <circle cx="70" cy="65" r="8" fill="#C9A227"/>
  
  <!-- Connection lines -->
  <line x1="50" y1="25" x2="30" y2="65" stroke="#5E6AD2" stroke-width="2"/>
  <line x1="50" y1="25" x2="70" y2="65" stroke="#5E6AD2" stroke-width="2"/>
  <line x1="30" y1="65" x2="70" y2="65" stroke="#5E6AD2" stroke-width="2"/>
  
  <!-- Subtle F in center -->
  <text x="50" y="52" font-family="Space Grotesk, sans-serif" font-size="16" font-weight="700" fill="#5E6AD2" text-anchor="middle" opacity="0.3">F</text>
</svg>
